services:
  - type: web
    name: trading-gateway
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: trading-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: trading-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: trading-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: trading-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: trading-db
          property: password
      - key: REDIS_URL
        fromService:
          name: trading-redis
          type: redis
          property: connectionString
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      # --- Fill these in Render dashboard ---
      - key: WEBHOOK_PASSPHRASE
        value: "CHANGE_ME"
      - key: BYBIT_TESTNET
        value: "true"

databases:
  - name: trading-db
    plan: free

  - name: trading-redis
    type: redis
    plan: free
