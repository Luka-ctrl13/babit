# Zabbix user parameters for Trading Gateway monitoring
# Place in: /etc/zabbix/zabbix_agentd.d/trading.conf

# Check if Horizon (queue worker) process is running
UserParameter=horizon.running,pgrep -f "artisan horizon" > /dev/null 2>&1 && echo 1 || echo 0

# Number of pending signals in queue
UserParameter=trading.signals.pending,cd /var/www/babit && php artisan tinker --execute="echo App\Models\Signal::where('status','pending')->count();" 2>/dev/null | tail -1

# Number of failed signals (last 24h)
UserParameter=trading.signals.failed_24h,cd /var/www/babit && php artisan tinker --execute="echo App\Models\Signal::where('status','failed')->where('created_at','>=',now()->subDay())->count();" 2>/dev/null | tail -1

# Emergency stop status
UserParameter=trading.emergency_stop,cd /var/www/babit && php artisan tinker --execute="echo App\Models\Setting::isEmergencyStop() ? 1 : 0;" 2>/dev/null | tail -1

# Horizon queue size via Redis
UserParameter=trading.queue.size,redis-cli llen trading-queue 2>/dev/null || echo 0
